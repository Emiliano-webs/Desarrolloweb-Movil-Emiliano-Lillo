

<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  
  <style>
 .col-12, .col-3, .col-6, .col {
    padding: 20px 10px;
    text-align: center;
    border-radius: 1px;
    font-weight: 500;
  }
  
  .row {
    margin-bottom: 15px;
  }
  
  .mi-header {
    padding: 40px 20px;
    margin-bottom: 25px;
  }
  
</style>
</head>
<body>

<div class="container-fluid bg-primary text-Black text-center mi-header">
  <h1>My First Bootstrap :D</h1>
  <p class="mb-0">Emiliano Lillo</p>
</div>

<div class="container-fluid">
  <div class="row">
  <div class= "p-2 bg-warning col-12">Gran columna (12=100%) </div>
  </div>
  </div>
  
  <div class="container-fluid">
  <div class="row">
    <div class="p-2 bg-primary col-3">Columna 1 (3 = 25%)</div>
    <div class="p-2 bg-secondary col-6">Columna 2 (6 = 50%)</div>
    <div class="p-2 bg-primary col-3">Columna 3 (3 = 25%)</div>
  </div>
</div>

<div class="container-fluid mt-0">
  <div class="row">
    <div class="p-3 bg-danger col">Característica 1 (33.33%)</div>
    <div class="p-3 bg-warning col">Característica 2 (33.33%)</div>
    <div class="p-3 bg-primary col">Característica 3 (33.33%)</div>
  </div>
</div>

<div class="container-fluid mt-0">
  <div class="row">
    <div class="p-2 bg-danger col">Columna 1 (25%)</div>
    <div class="p-2 bg-warning col">Columna 2 (25%)</div>
    <div class="p-2 bg-primary col">Columna 3 (25%)</div>
    <div class="p-2 bg-secondary col">Columna 4 (25%)</div>

  </div>
</div>
</body>
</html>
